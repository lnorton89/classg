proxy_cache_path /var/cache/nginx/satellite levels=1:2 keys_zone=satellite_tiles:10m max_size=2g inactive=180d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx's bundled mime.types has no .webmanifest entry, so the manifest goes
    # out as application/octet-stream. Browsers vary in how much they tolerate
    # that, and the failure mode is the bad one: the page still loads, the
    # manifest still 200s, and the install prompt simply never appears with
    # nothing in the console to say why.
    #
    # Overridden per-location rather than with a `types` block: a types block in
    # a server context REPLACES the inherited map instead of extending it, which
    # would strip the correct types from every stylesheet and script here.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Serve tiles baked into the image first. If one is absent, fetch it from
    # upstream imagery and retain it in the persistent cache.
    #
    # Esri World Imagery rather than USGS: USGS ImageryOnly has no pixels past
    # z16 here (1.66 m/px) and 404s above it, so every closer view was an
    # upsample. Esri carries real imagery to z19 (0.21 m/px). The URL shape is
    # identical -- both are ArcGIS MapServer tile endpoints wanting {z}/{y}/{x}
    # -- so only the host and service name change. Keep BASEMAP_MAX_ZOOM in
    # src/features/map/style.ts in step with whatever this points at.
    location ~ ^/tiles/basemap/[0-9]+/[0-9]+/[0-9]+\.jpg$ {
        try_files $uri @satellite_tile;
    }

    location @satellite_tile {
        rewrite ^/tiles/basemap/([0-9]+)/([0-9]+)/([0-9]+)\.jpg$ /ArcGIS/rest/services/World_Imagery/MapServer/tile/$1/$3/$2 break;
        proxy_pass https://services.arcgisonline.com;
        proxy_ssl_server_name on;
        proxy_ssl_name services.arcgisonline.com;
        proxy_set_header Host services.arcgisonline.com;
        proxy_set_header User-Agent "ClassG satellite tile cache/0.1";
        proxy_cache satellite_tiles;
        proxy_cache_lock on;
        proxy_cache_valid 200 180d;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @empty_tile;
        add_header X-ClassG-Basemap "Esri World Imagery (cached)" always;
    }

    location @empty_tile {
        empty_gif;
        add_header Cache-Control "no-store" always;
        add_header X-ClassG-Basemap "offline fallback" always;
    }

    # Vite fingerprints these, so the filename changes whenever the bytes do and
    # a year-long immutable cache is safe. Without an explicit Cache-Control
    # nginx sends none at all, and the browser falls back to guessing from
    # Last-Modified -- which caches too little here and far too much below.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The shell must not be cached. It is the only unfingerprinted file, so it
    # is what names the current bundle; a browser holding an old copy keeps
    # loading the old app after a deploy and there is nothing on screen to say
    # so. Observed after deploying a fix: the page kept serving
    # index-B3lBO10v.js while the server had moved to index-CJe6gdIY.js.
    #
    # no-cache means revalidate, not "do not store" -- the ETag still saves the
    # transfer when nothing changed.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
