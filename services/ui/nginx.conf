proxy_cache_path /var/cache/nginx/satellite levels=1:2 keys_zone=satellite_tiles:10m max_size=2g inactive=180d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Serve tiles baked into the image first. If one is absent, fetch the
    # public-domain USGS imagery tile and retain it in the persistent cache.
    location ~ ^/tiles/basemap/[0-9]+/[0-9]+/[0-9]+\.jpg$ {
        try_files $uri @satellite_tile;
    }

    location @satellite_tile {
        rewrite ^/tiles/basemap/([0-9]+)/([0-9]+)/([0-9]+)\.jpg$ /arcgis/rest/services/USGSImageryOnly/MapServer/tile/$1/$3/$2 break;
        proxy_pass https://basemap.nationalmap.gov;
        proxy_ssl_server_name on;
        proxy_ssl_name basemap.nationalmap.gov;
        proxy_set_header Host basemap.nationalmap.gov;
        proxy_set_header User-Agent "ClassG satellite tile cache/0.1";
        proxy_cache satellite_tiles;
        proxy_cache_lock on;
        proxy_cache_valid 200 180d;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @empty_tile;
        add_header X-ClassG-Basemap "USGS imagery (cached)" always;
    }

    location @empty_tile {
        empty_gif;
        add_header Cache-Control "no-store" always;
        add_header X-ClassG-Basemap "offline fallback" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
