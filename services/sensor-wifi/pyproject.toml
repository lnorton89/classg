[project]
name = "classg-sensor-wifi"
version = "0.1.0"
description = "ClassG Wi-Fi sensor: monitor-mode capture and Remote ID / DJI DroneID decoding"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pyzmq>=25.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
replay = ["scapy>=2.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
classg-sensor-wifi = "classg_wifi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classg_wifi*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

# scapy ships no type stubs and is an optional extra (only cmd_replay imports
# it). pyzmq DOES ship stubs, so it is deliberately not listed here -- it is
# type-checked for real.
[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
