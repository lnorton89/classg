# Wi-Fi vendor fingerprints -> detection Class C.
#
# WEAKEST evidence class in the system (confidence weight 0.10 in fusion). It exists
# to catch drones broadcasting no Remote ID at all, and costs nothing on top of
# frames already being captured.
#
# Two known failure modes, both handled in code:
#   - MAC randomisation: locally-administered addresses are skipped entirely
#     (fingerprint.py::_is_locally_administered), since the OUI is meaningless.
#   - OUI reassignment / non-drone products from the same vendor: a DJI OUI could
#     belong to a controller, a gimbal, or a handheld camera. Never a confirmation
#     on its own.
#
# SSID patterns are stronger than OUIs and are checked first. Patterns are
# fnmatch-style and matched case-insensitively.
#
# Verify additions against https://standards-oui.ieee.org/ before adding them.
#
# `oui_owner_patterns` does that verification for you. Each pattern is matched
# (fnmatch, case-insensitive) against IEEE registrant names in the downloaded
# oui.csv, and every block assigned to a matching organisation is added. That
# catches the blocks nobody has transcribed into `ouis` below, and it cannot be
# wrong about who owns one. It needs data/ieee-oui.csv -- run
# scripts/fetch-oui-registry.sh -- and is skipped entirely when that file is
# absent, so the hand-listed `ouis` remain the offline baseline.
#
# Keep patterns as specific as the vendor name allows. "*autel*" also matches
# Autel Intelligent Technology, who make car diagnostic tools; every block of
# theirs would become a Class C false positive on a garage forecourt.

# NOTE: for aircraft that broadcast ASTM F3411 Remote ID, vendor identification
# now comes from the CTA-2063-A manufacturer code embedded in the serial number
# (parsers/odid.py::CTA2063_MANUFACTURERS). That is strictly better than an OUI
# match -- it is carried in the payload, so MAC randomisation cannot defeat it.
# This file is the fallback for aircraft broadcasting no Remote ID at all.

vendors:
  - vendor: dji
    ouis:
      - "60:60:1f"
      - "34:d2:62"
      - "48:1c:b9"
      - "e4:7a:2c"
      # Observed 2026-08-10 transmitting Remote ID from a DJI Mini 5 Pro.
      # The CTA-2063-A serial confirmed DJI (mfr code 1581); the OUI itself
      # could NOT be confirmed against the IEEE registry, so this entry rests
      # on a single observation. Verify at https://standards-oui.ieee.org/
      # before relying on it - a wrong OUI produces false positives.
      - "8c:1e:d9"
    # IEEE lists DJI as "SZ DJI TECHNOLOGY CO.,LTD". No other registrant has
    # "dji" in its name, so the loose pattern is safe here.
    oui_owner_patterns:
      - "*dji*"
    ssid_patterns:
      # Observed on a DJI Mini 5 Pro 2026-08-10: the SSID is literally
      # "RID-<CTA-2063-A serial>", e.g. RID-1581Fxxxxxxxxxxxxxxx (serial
      # redacted; the mfr code 1581 is what matters here). That embeds the
      # manufacturer code in the SSID, so it identifies the vendor with no
      # OUI lookup and no payload parsing at all.
      - "rid-1581*"
      - "mavic-*"
      - "phantom-*"
      - "tello-*"
      - "spark-*"
      - "dji-*"
      - "air-*"
      - "mini-*"

  - vendor: parrot
    ouis:
      - "90:03:b7"
      - "00:12:1c"
      - "a0:14:3d"
    oui_owner_patterns:
      - "parrot*"
    ssid_patterns:
      - "bebop-*"
      - "anafi-*"
      - "ardrone*"
      - "disco-*"

  - vendor: autel
    ouis: []
    # Deliberately NOT "*autel*" -- see the note at the top of this file. Autel
    # Robotics makes the drones; Autel Intelligent Technology makes OBD-II
    # scan tools, and matching both would put a Class C hit on every car.
    oui_owner_patterns:
      - "autel robotics*"
    ssid_patterns:
      - "autel-*"
      - "evo-*"

  - vendor: skydio
    ouis: []
    oui_owner_patterns:
      - "skydio*"
    ssid_patterns:
      - "skydio-*"

  - vendor: yuneec
    ouis: []
    oui_owner_patterns:
      - "yuneec*"
    ssid_patterns:
      - "typhoon-*"
      - "yuneec-*"

  # A Remote ID SSID whose manufacturer code we do not recognise. Reported as an
  # unknown vendor rather than guessed at -- attributing it to DJI because DJI is
  # the vendor we happen to have tested would manufacture false positives.
  # Resolve the real vendor from the CTA-2063-A code in the serial, then add a
  # proper entry above.
  - vendor: unknown_remote_id
    ouis: []
    ssid_patterns:
      - "rid-*"
