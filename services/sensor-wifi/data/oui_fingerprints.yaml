# Wi-Fi vendor fingerprints -> detection Class C.
#
# WEAKEST evidence class in the system (confidence weight 0.10 in fusion). It exists
# to catch drones broadcasting no Remote ID at all, and costs nothing on top of
# frames already being captured.
#
# Two known failure modes, both handled in code:
#   - MAC randomisation: locally-administered addresses are skipped entirely
#     (fingerprint.py::_is_locally_administered), since the OUI is meaningless.
#   - OUI reassignment / non-drone products from the same vendor: a DJI OUI could
#     belong to a controller, a gimbal, or a handheld camera. Never a confirmation
#     on its own.
#
# SSID patterns are stronger than OUIs and are checked first. Patterns are
# fnmatch-style and matched case-insensitively.
#
# Verify additions against https://standards-oui.ieee.org/ before adding them.

# NOTE: for aircraft that broadcast ASTM F3411 Remote ID, vendor identification
# now comes from the CTA-2063-A manufacturer code embedded in the serial number
# (parsers/odid.py::CTA2063_MANUFACTURERS). That is strictly better than an OUI
# match -- it is carried in the payload, so MAC randomisation cannot defeat it.
# This file is the fallback for aircraft broadcasting no Remote ID at all.

vendors:
  - vendor: dji
    ouis:
      - "60:60:1f"
      - "34:d2:62"
      - "48:1c:b9"
      - "e4:7a:2c"
      # Observed 2026-08-10 transmitting Remote ID from a DJI Mini 5 Pro.
      # The CTA-2063-A serial confirmed DJI (mfr code 1581); the OUI itself
      # could NOT be confirmed against the IEEE registry, so this entry rests
      # on a single observation. Verify at https://standards-oui.ieee.org/
      # before relying on it - a wrong OUI produces false positives.
      - "8c:1e:d9"
    ssid_patterns:
      - "mavic-*"
      - "phantom-*"
      - "tello-*"
      - "spark-*"
      - "dji-*"
      - "air-*"
      - "mini-*"

  - vendor: parrot
    ouis:
      - "90:03:b7"
      - "00:12:1c"
      - "a0:14:3d"
    ssid_patterns:
      - "bebop-*"
      - "anafi-*"
      - "ardrone*"
      - "disco-*"

  - vendor: autel
    ouis: []
    ssid_patterns:
      - "autel-*"
      - "evo-*"

  - vendor: skydio
    ouis: []
    ssid_patterns:
      - "skydio-*"

  - vendor: yuneec
    ouis: []
    ssid_patterns:
      - "typhoon-*"
      - "yuneec-*"
