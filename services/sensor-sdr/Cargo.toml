[package]
name = "classg-sensor-sdr"
version = "0.1.0"
edition = "2021"
description = "ClassG SDR sensor: sub-2 GHz control-link, FPV, and ADS-B detection"

[dependencies]
num-complex = "0.4"
# Added as the capture loop lands (Milestones 2-3):
#   rustfft   = "6"      FFT for the sweep engine
#   rtlsdr    = "0.1"    or FFI to the RTL-SDR Blog fork -- NOT stock librtlsdr
#   zmq       = "0.10"   detection bus
#   serde     = { version = "1", features = ["derive"] }
#   serde_json = "1"

[profile.release]
opt-level = 3
lto = true
