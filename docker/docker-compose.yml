# Web tier only. Sensors run on the host, outside Compose. Containers reach the
# sensor publisher over the host network and talk to each other over the Compose
# network.

name: classg

services:
  fusion:
    image: classg-fusion:local
    container_name: classg-fusion
    build:
      context: ..
      dockerfile: services/fusion/Dockerfile
    environment:
      CLASSG_DETECTION_ENDPOINT: tcp://0.0.0.0:5556
      CLASSG_FUSION_DETECTION_SOCKET_MODE: listen
      CLASSG_TRACK_ENDPOINT: tcp://0.0.0.0:5557
      CLASSG_DETECTION_TOPIC: ${CLASSG_DETECTION_TOPIC:-detection.}
      CLASSG_HEARTBEAT_TOPIC: ${CLASSG_HEARTBEAT_TOPIC:-heartbeat.}
      CLASSG_TRACK_TOPIC: ${CLASSG_TRACK_TOPIC:-track.}
      CLASSG_FUSION_SENSOR_STALE_AFTER: ${CLASSG_FUSION_SENSOR_STALE_AFTER:-30s}
      CLASSG_FUSION_TRACK_TTL: ${CLASSG_FUSION_TRACK_TTL:-5m}
      CLASSG_FUSION_REAP_INTERVAL: ${CLASSG_FUSION_REAP_INTERVAL:-1s}
    ports:
      # Loopback by default. The host sensors dial 127.0.0.1, and anything that
      # can reach this port can publish fabricated detections and heartbeats
      # into fusion -- there is no authentication on the bus. Set
      # CLASSG_BUS_BIND=0.0.0.0 in .env only when remote sensors on a trusted
      # network genuinely need to publish here (ADR-0009), and firewall it.
      - "${CLASSG_BUS_BIND:-127.0.0.1}:${CLASSG_BUS_PORT:-5556}:5556"
    restart: unless-stopped

  api:
    image: classg-api:local
    container_name: classg-api
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # ADR-0007: Tier 1 only. Runtime settings live in the database in the
    # classg-data volume, seeded on first run from config/defaults.yaml.
    # Anything set here is reported by GET /config/settings as source "env" and
    # is read-only in the UI, so an override is visible rather than mysterious.
    environment:
      # --- Tier 1: bootstrap and secrets
      CLASSG_LISTEN: ${CLASSG_LISTEN:-:8081}
      CLASSG_LOG_LEVEL: ${CLASSG_LOG_LEVEL:-info}
      CLASSG_STORE: ${CLASSG_STORE:-libsql}
      CLASSG_DB: /data/classg.db
      CLASSG_CONFIG_SEED: /etc/classg/defaults.yaml
      CLASSG_TURSO_URL: ${CLASSG_TURSO_URL:-}
      CLASSG_TURSO_AUTH_TOKEN: ${CLASSG_TURSO_AUTH_TOKEN:-}
      CLASSG_TURSO_SYNC_INTERVAL: ${CLASSG_TURSO_SYNC_INTERVAL:-1m}

      # --- Authentication (Tier 1: the OIDC secret is a secret, and a unit
      # whose auth mode is editable through its own web UI can be switched off
      # by whoever already got in).
      #
      # Defaults to `required`. A unit with no accounts serves only the setup
      # screen until someone creates the first administrator -- there is no
      # default password.
      CLASSG_AUTH_MODE: ${CLASSG_AUTH_MODE:-required}
      CLASSG_SESSION_TTL: ${CLASSG_SESSION_TTL:-12h}
      CLASSG_OIDC_ISSUER: ${CLASSG_OIDC_ISSUER:-}
      CLASSG_OIDC_CLIENT_ID: ${CLASSG_OIDC_CLIENT_ID:-}
      CLASSG_OIDC_CLIENT_SECRET: ${CLASSG_OIDC_CLIENT_SECRET:-}
      CLASSG_OIDC_REDIRECT_URL: ${CLASSG_OIDC_REDIRECT_URL:-}
      CLASSG_OIDC_AUTO_PROVISION: ${CLASSG_OIDC_AUTO_PROVISION:-false}
      CLASSG_OIDC_ROLE: ${CLASSG_OIDC_ROLE:-viewer}

      # --- Email hooks. Credentials are Tier 1 for the same reason.
      CLASSG_SMTP_HOST: ${CLASSG_SMTP_HOST:-}
      CLASSG_SMTP_PORT: ${CLASSG_SMTP_PORT:-}
      CLASSG_SMTP_USERNAME: ${CLASSG_SMTP_USERNAME:-}
      CLASSG_SMTP_PASSWORD: ${CLASSG_SMTP_PASSWORD:-}
      CLASSG_SMTP_FROM: ${CLASSG_SMTP_FROM:-}

      # Where the host-side agents publish their state. The API only ever reads
      # those files and writes a deploy-request marker -- it has no way to run
      # anything on the host, deliberately (internal/deploy).
      CLASSG_DEPLOY_STATE_DIR: /var/lib/classg/agent-state

      # --- Deliberate Tier 2 overrides: container topology the seed cannot know.
      # The seed says 127.0.0.1, which is correct on a Pi and wrong here --
      # container loopback is not the host's.
      CLASSG_TRACK_ENDPOINT: tcp://fusion:5557
      CLASSG_DETECTION_ENDPOINT: tcp://fusion:5557
      # nginx serves the UI in this layout, so the API serves no static files.
      CLASSG_UI_DIR: "off"
      CLASSG_CAPTURE_DIR: /captures
      # Operator captures must target the stable primary-radio name. Passing
      # the .env override also updates an already-seeded settings database.
      CLASSG_WIFI_INTERFACE: ${CLASSG_WIFI_INTERFACE:-wlan-alfa}

    # The agent-state bind mount is shared with host processes running as the
    # operator, and this container runs as its own unprivileged user. Without a
    # group in common the container can read that directory and not write to
    # it, which is the worst of the three outcomes: every read path works, the
    # Spectrum page reports the sweep agent available, and the first sweep
    # fails with "permission denied" on the request file. Exactly that shipped.
    #
    # scripts/agent-state-setup.sh sets the directory to 2775 and records its
    # gid here. 1000 is the fallback because that is the operator account on a
    # stock Pi OS image; the container keeps its own uid either way.
    group_add:
      - "${CLASSG_AGENT_STATE_GID:-1000}"

    volumes:
      - classg-data:/data
      - ../captures:/captures:ro
      # The host agents' state directory. Read-write because the API writes the
      # deploy-request marker the agent picks up; everything else here it only
      # reads. Nothing in this mount grants host control -- that is the whole
      # point of exchanging files rather than giving the container a socket.
      #
      # ${CLASSG_AGENT_STATE_DIR} must match CLASSG_DEPLOY_STATE on the host
      # side (the agents' own default is ~/.local/state/classg).
      - ${CLASSG_AGENT_STATE_DIR:-../.agent-state}:/var/lib/classg/agent-state
      # Read-only: the seed is consulted on first run and whenever a setting has
      # never been stored. Editing it later is deliberately inert -- the
      # database is authoritative and the API is how settings change.
      - ../config/defaults.yaml:/etc/classg/defaults.yaml:ro
    ports:
      - "${CLASSG_API_PORT:-8081}:8081"
    restart: unless-stopped
    depends_on:
      - fusion

  ui:
    image: classg-ui:local
    container_name: classg-ui
    build:
      context: ..
      dockerfile: services/ui/Dockerfile
      args:
        CLASSG_TILE_PRELOAD_BBOX: ${CLASSG_TILE_PRELOAD_BBOX:-}
        CLASSG_TILE_PRELOAD_MIN_ZOOM: ${CLASSG_TILE_PRELOAD_MIN_ZOOM:-12}
        CLASSG_TILE_PRELOAD_MAX_ZOOM: ${CLASSG_TILE_PRELOAD_MAX_ZOOM:-15}
        CLASSG_TILE_PRELOAD_MAX_TILES: ${CLASSG_TILE_PRELOAD_MAX_TILES:-600}
        CLASSG_TILE_PRELOAD_CONCURRENCY: ${CLASSG_TILE_PRELOAD_CONCURRENCY:-8}
        CLASSG_SATELLITE_TILE_URL: ${CLASSG_SATELLITE_TILE_URL:-}
    volumes:
      - classg-tile-cache:/var/cache/nginx/satellite
    ports:
      - "${CLASSG_UI_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  classg-data:
    name: classg-data
  classg-tile-cache:
    name: classg-tile-cache
