# Web tier only. Sensors run in WSL or on the Linux host. Containers reach the
# sensor publisher through host.docker.internal and talk to each other over the
# Compose network.

name: classg

services:
  fusion:
    image: classg-fusion:local
    container_name: classg-fusion
    build:
      context: ..
      dockerfile: services/fusion/Dockerfile
    environment:
      CLASSG_DETECTION_ENDPOINT: tcp://0.0.0.0:5556
      CLASSG_FUSION_DETECTION_SOCKET_MODE: listen
      CLASSG_TRACK_ENDPOINT: tcp://0.0.0.0:5557
      CLASSG_DETECTION_TOPIC: ${CLASSG_DETECTION_TOPIC:-detection.}
      CLASSG_HEARTBEAT_TOPIC: ${CLASSG_HEARTBEAT_TOPIC:-heartbeat.}
      CLASSG_TRACK_TOPIC: ${CLASSG_TRACK_TOPIC:-track.}
      CLASSG_FUSION_SENSOR_STALE_AFTER: ${CLASSG_FUSION_SENSOR_STALE_AFTER:-30s}
      CLASSG_FUSION_TRACK_TTL: ${CLASSG_FUSION_TRACK_TTL:-5m}
      CLASSG_FUSION_REAP_INTERVAL: ${CLASSG_FUSION_REAP_INTERVAL:-1s}
    ports:
      - "${CLASSG_BUS_PORT:-5556}:5556"
    restart: unless-stopped

  api:
    image: classg-api:local
    container_name: classg-api
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # ADR-0007: Tier 1 only. Runtime settings live in the database in the
    # classg-data volume, seeded on first run from config/defaults.yaml.
    # Anything set here is reported by GET /config/settings as source "env" and
    # is read-only in the UI, so an override is visible rather than mysterious.
    environment:
      # --- Tier 1: bootstrap and secrets
      CLASSG_LISTEN: ${CLASSG_LISTEN:-:8081}
      CLASSG_LOG_LEVEL: ${CLASSG_LOG_LEVEL:-info}
      CLASSG_STORE: ${CLASSG_STORE:-libsql}
      CLASSG_DB: /data/classg.db
      CLASSG_CONFIG_SEED: /etc/classg/defaults.yaml
      CLASSG_TURSO_URL: ${CLASSG_TURSO_URL:-}
      CLASSG_TURSO_AUTH_TOKEN: ${CLASSG_TURSO_AUTH_TOKEN:-}
      CLASSG_TURSO_SYNC_INTERVAL: ${CLASSG_TURSO_SYNC_INTERVAL:-1m}

      # --- Deliberate Tier 2 overrides: container topology the seed cannot know.
      # The seed says 127.0.0.1, which is correct on a Pi and wrong here --
      # container loopback is not the host's.
      CLASSG_TRACK_ENDPOINT: tcp://fusion:5557
      CLASSG_DETECTION_ENDPOINT: tcp://fusion:5557
      # nginx serves the UI in this layout, so the API serves no static files.
      CLASSG_UI_DIR: "off"
      CLASSG_CAPTURE_DIR: /captures
    volumes:
      - classg-data:/data
      - ../captures:/captures:ro
      # Read-only: the seed is consulted on first run and whenever a setting has
      # never been stored. Editing it later is deliberately inert -- the
      # database is authoritative and the API is how settings change.
      - ../config/defaults.yaml:/etc/classg/defaults.yaml:ro
    ports:
      - "${CLASSG_API_PORT:-8081}:8081"
    restart: unless-stopped
    depends_on:
      - fusion

  ui:
    image: classg-ui:local
    container_name: classg-ui
    build:
      context: ..
      dockerfile: services/ui/Dockerfile
      args:
        CLASSG_TILE_PRELOAD_BBOX: ${CLASSG_TILE_PRELOAD_BBOX:-}
        CLASSG_TILE_PRELOAD_MIN_ZOOM: ${CLASSG_TILE_PRELOAD_MIN_ZOOM:-12}
        CLASSG_TILE_PRELOAD_MAX_ZOOM: ${CLASSG_TILE_PRELOAD_MAX_ZOOM:-15}
        CLASSG_TILE_PRELOAD_MAX_TILES: ${CLASSG_TILE_PRELOAD_MAX_TILES:-600}
        CLASSG_TILE_PRELOAD_CONCURRENCY: ${CLASSG_TILE_PRELOAD_CONCURRENCY:-8}
        CLASSG_SATELLITE_TILE_URL: ${CLASSG_SATELLITE_TILE_URL:-}
    volumes:
      - classg-tile-cache:/var/cache/nginx/satellite
    ports:
      - "${CLASSG_UI_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  classg-data:
    name: classg-data
  classg-tile-cache:
    name: classg-tile-cache
