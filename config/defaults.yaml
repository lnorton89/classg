# ClassG default settings — Tier 3 of ADR-0007.
#
# What this file is:
#   - the values used to seed the settings table the first time a database is
#     created
#   - the ENTIRE configuration when CLASSG_STORE=memory (CI, dev machines)
#
# What this file is NOT:
#   - a place for secrets. CLASSG_TURSO_AUTH_TOKEN and CLASSG_TURSO_URL live in
#     .env and nowhere else.
#   - the final word at runtime. Once seeded, the database is authoritative and
#     these values are edited through the API (PUT /config/*), not by editing
#     this file. Changing a value here after first run affects nothing until the
#     database is recreated or explicitly re-seeded.
#
# Precedence:  environment  >  database  >  this file  >  built-in Go default
# GET /config reports which of those each effective value came from.

# --- Bus -------------------------------------------------------------------
# Endpoints describe both ends of the sensor bus. Native Linux uses a binding
# sensor and a dialing fusion. The Windows/WSL Docker layout reverses ownership:
# fusion listens on Compose's published port and the WSL sensor connects out to
# host.docker.internal, because container loopback and WSL loopback are not the
# same network.
bus:
  detection_endpoint: tcp://127.0.0.1:5556
  track_endpoint: tcp://127.0.0.1:5557
  detection_topic: "detection."
  track_topic: "track."
  heartbeat_topic: "heartbeat."

# --- Sensors ---------------------------------------------------------------
sensors:
  # Declaring sensors up front is what lets /health report one that never
  # started. Without it, a sensor that dies before its first heartbeat is simply
  # absent from the list, and absent reads as "quiet sky" -- the false
  # confidence ADR-0003 exists to prevent.
  #
  # `optional: true` is for hardware this unit may not have fitted -- an SDR or
  # a BLE dongle on a build that ships without one. It suppresses exactly one
  # case: never having reported at all. Once the sensor has heartbeated it is
  # held to the same standard as any other, so a radio that worked and then
  # stopped still degrades /health. Without it the only choices are a permanent
  # `degraded` on a unit with no SDR, or omitting the sensor entirely and
  # losing the ability to notice when it dies.
  expected:
    - id: wifi-0
      kind: wifi
    # - id: sdr-0
    #   kind: sdr
    #   optional: true
    # The network ADS-B feed heartbeats like a radio does, so declaring it here
    # is what lets /health report an uplink that never came back. It runs inside
    # fusion rather than as its own unit, so the sensors page offers no restart
    # button for it -- restart fusion. Only declare it if fusion.net_adsb is on.
    # - id: net-adsb-0
    #   kind: net
    #   optional: true

  # Three missed heartbeats at the sensor default of 10s. Two would make one
  # scheduling hiccup on a loaded Pi look like a dead radio.
  stale_after: 30s

  restart_command: "systemctl restart %s"

# --- Fusion ----------------------------------------------------------------
fusion:
  track_ttl: 5m
  max_history: 512

  # --- Optional external data. All off; see docs/ops/07-external-data.md.
  #
  # Each of these enriches detections that already work without it, so every
  # one degrades rather than failing: a dropped uplink or a missing file costs
  # the enrichment and nothing else. None of them ever sends a detection out.

  # Manned traffic from a community ADS-B aggregator, for Class D correlation
  # on a unit with no SDR fitted. Needs map.receiver_position set -- it is the
  # centre of the query, and an unset 0,0 is refused rather than treated as the
  # Gulf of Guinea. Declare net_adsb_sensor_id in sensors.expected above if you
  # want /health to notice a feed that never starts.
  net_adsb: false
  net_adsb_url: https://api.adsb.lol
  net_adsb_radius_nm: 25
  net_adsb_interval: 10s
  net_adsb_sensor_id: net-adsb-0

  # Ground elevation, so height_agl_m stops being mostly null. Worth enabling
  # even with no uplink: point terrain_url at a local OpenTopoData with SRTM
  # tiles and set terrain_min_interval to 0.
  terrain: false
  terrain_url: https://api.opentopodata.org
  terrain_dataset: srtm30m
  terrain_min_interval: 1s
  # Local geoid undulation in metres, and NOT optional in practice. Elevation
  # datasets report orthometric height; Remote ID reports height above the
  # WGS-84 ellipsoid. Leaving this 0 does not skip a correction, it applies a
  # wrong one -- roughly -22 m around Seattle, up to 100 m elsewhere, and in
  # the direction that makes flights look lower than they are.
  terrain_geoid_offset_m: 0

  # OpenSky aircraft database CSV, read once at startup, so an ADS-B contact
  # reads "N512UP, a Cessna 208" instead of "A1B2C3". `make data-aircraft`.
  aircraft_db: ""

# --- Retention -------------------------------------------------------------
# Uniform across all data. Operator location is retained like any other field
# (ADR-0006) -- this deployment has decided that is acceptable.
retention:
  detections: 168h   # 7 days: enough for parser debugging and incident review
  tracks: 2160h      # 90 days: trend and pattern analysis
  interval: 1h       # how often the retention job runs

# --- Capture ---------------------------------------------------------------
# Defaults for operator-initiated captures. The interface is deliberately not
# settable from the browser.
capture:
  wifi_interface: wlan1
  # Measured: the DJI Mini 5 Pro beacons on channel 6 at ~4.17 Hz.
  # See docs/ops/04-calibration.md.
  wifi_channel: 6
  duration_s: 120
  label: sensor-capture
  dir: captures
  allow_unprivileged: false

# --- Map -------------------------------------------------------------------
map:
  # "lat,lon" in decimal degrees. Centres the map before any track exists to
  # derive a position from -- the only other sources are the operator's own
  # ODID position (only present once a drone is flying) and the browser's
  # geolocation (needs a permission prompt and a secure origin, neither
  # guaranteed on a Pi reached over plain http on a LAN address). Empty means
  # unconfigured.
  #
  # Also read by fusion, as CLASSG_RECEIVER_POSITION, to centre the network
  # ADS-B query. One key rather than two: a detector cannot be in two places,
  # and a map centred somewhere the traffic query is not would be worse than
  # either alone.
  receiver_position: ""

# --- API -------------------------------------------------------------------
api:
  # The pilot's ground position. Included by default for this deployment;
  # see ADR-0006 and docs/research/06-legal-and-ethics.md.
  expose_operator_location: true
  # Path to the built UI, or "off" to serve API only. Dev uses "off" because
  # Vite serves the app -- letting the Go binary serve a stale dist/ is the most
  # confusing failure mode in this project.
  ui_dir: ../ui/dist
