name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # sensor-wifi (Python) -- the protocol parsers.
  #
  # Highest-value suite in the repo: parser bugs here are SILENT, producing
  # plausible wrong positions rather than crashes. Includes Hypothesis property
  # tests asserting that arbitrary bytes never crash the parsers, since a drone
  # detector that dies on a malformed beacon is a denial-of-service target.
  # ---------------------------------------------------------------------------
  python:
    name: sensor-wifi (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sensor-wifi
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.12 is what the Pi ships.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/sensor-wifi/pyproject.toml

      - name: Install
        # Includes the replay extra (scapy): analyze, replay and the real-capture
        # vector tests are core functionality, not optional tooling. Installing
        # only [dev] makes those tests fail on import rather than skip, which
        # reads as a broken parser instead of a missing dependency.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,replay]'

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy --strict)
        run: python -m mypy classg_wifi

      - name: Test
        run: python -m pytest -q

      # docs/operator-guide.json powers the in-app docs page and quotes CLI
      # commands, make targets and repo paths verbatim; nothing else checks it
      # against reality the way schemas get conformance tests. It has already
      # documented a flag the CLI accepted and ignored.
      - name: Operator guide matches the CLI
        run: python ../../scripts/check-operator-guide.py

  # ---------------------------------------------------------------------------
  # fusion (Go) -- track correlation and confidence scoring.
  #
  # Run with -race: TrackStore is mutex-guarded shared state written by the bus
  # consumer and read by the API, so data races are a live risk here.
  # ---------------------------------------------------------------------------
  go:
    name: fusion (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fusion
    steps:
      - uses: actions/checkout@v7

      # go-version-file, not a literal: go.mod pins a PATCH version (1.26.6,
      # for the stdlib CVEs) and GOTOOLCHAIN=local forbids downloading a newer
      # toolchain, so a literal "1.26" here resolves to whatever patch the
      # runner ships and fails the moment go.mod moves ahead of it. That is
      # exactly how this job broke: go.mod said 1.26.6, the runner had 1.26.5.
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/fusion/go.mod
          cache-dependency-path: services/fusion/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  api:
    name: api (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      # See the fusion job: read the version from go.mod so it cannot drift.
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Generated SQL must match the .sql files it came from. Without this an
      # edited query with stale generated code compiles fine and quietly does
      # the old thing.
      - name: sqlc up to date
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

      - name: Test
        run: go test -count=1 ./...

  ui:
    name: ui (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # sensor-sdr (Rust) -- SDR abstraction and band sweep planning.
  #
  # The tests here encode the hardware constraint the whole project is built
  # around: asking the RTL-SDR for 2.4/5.8 GHz must fail with an actionable
  # error, and every band in the sweep plan must be within the tuner's range.
  # ---------------------------------------------------------------------------
  rust:
    name: sensor-sdr (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sensor-sdr
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/sensor-sdr

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # sensor-wifi's output is checked against the detection schema; this sensor's
      # was not, which left the cross-language contract verified in three languages
      # out of four. The unit tests assert the field names from the Rust side, but
      # only the schema itself can say whether the emitted document is valid.
      - name: Detection schema conformance
        run: |
          python -m pip install --quiet jsonschema
          cargo run --quiet -- --emit-sample-detection > /tmp/sdr-sample.json
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          schema = json.loads(pathlib.Path("../../schemas/detection.schema.json").read_text())
          sample = json.loads(pathlib.Path("/tmp/sdr-sample.json").read_text())
          v = Draft202012Validator(schema)

          errs = sorted(v.iter_errors(sample), key=lambda e: list(e.path))
          if errs:
              for e in errs:
                  print(f"::error::sensor-sdr emits an invalid detection at "
                        f"{'/'.join(str(p) for p in e.path) or '(root)'}: {e.message}")
              sys.exit(1)

          # A validator that accepts anything would make the check above
          # meaningless, so prove it still rejects what it should.
          if not list(v.iter_errors({**sample, "invented_field": True})):
              print("::error::additionalProperties:false is not being enforced")
              sys.exit(1)
          print("sensor-sdr output conforms to detection.schema.json")
          PY

  # ---------------------------------------------------------------------------
  # Schemas are the cross-language contract (ADR-0001). A typo here breaks all
  # four services silently, so validate the schema itself is well-formed and
  # that the documented example still conforms to it.
  # ---------------------------------------------------------------------------
  schemas:
    name: schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install jsonschema

      - name: Validate schemas and a reference detection
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          failed = False
          for path in sorted(pathlib.Path("schemas").glob("*.schema.json")):
              schema = json.loads(path.read_text())
              try:
                  Draft202012Validator.check_schema(schema)
                  print(f"ok   {path}")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}"); failed = True

          # A minimal Detection must validate; a bad detection_class must not.
          schema = json.loads(pathlib.Path("schemas/detection.schema.json").read_text())
          v = Draft202012Validator(schema)
          good = {
              "schema_version": "1.0",
              "detection_id": "01J8XQ0000000000000000000A",
              "ts": "2026-08-10T14:23:11.482Z",
              "sensor_id": "wifi-0",
              "sensor_kind": "wifi",
              "detection_class": "A",
          }
          errs = list(v.iter_errors(good))
          if errs:
              print("FAIL reference detection rejected:", errs[0].message); failed = True
          else:
              print("ok   reference detection accepted")

          if not list(v.iter_errors({**good, "detection_class": "Z"})):
              print("FAIL invalid detection_class was accepted"); failed = True
          else:
              print("ok   invalid detection_class rejected")

          sys.exit(1 if failed else 0)
          PY

  # Single job for branch protection to require, so adding a language later does
  # not mean reconfiguring required checks.
  # The shell scripts are load-bearing -- they bring up the dev stack, put the
  # adapter in monitor mode and start the sensor -- and nothing checked them.
  # An unquoted expansion in scripts/dev-sensor.sh reached main because the only
  # thing that noticed was an editor plugin on one machine.
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck --version

      # .claude/hooks runs before a cloud session exists, so a bug there fails
      # where nobody is watching -- the same reason scripts/ is checked here.
      - run: shellcheck scripts/*.sh .claude/hooks/*.sh

  # Nothing checked dependencies for known vulnerabilities in any of the four
  # languages. That gap hid a reachable one: golang.org/x/text v0.15.0 carried
  # GO-2026-5970, an infinite loop on invalid input, with call traces from both
  # the API and fusion. A passive detector parses input it does not control, so
  # "a dependency loops forever on a malformed string" is the sensor going deaf
  # rather than a theoretical CVE.
  #
  # govulncheck is reachability-based: it reports what the code can actually
  # call, not merely what the module graph contains, so this stays quiet unless
  # something real appears.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          # go.mod says `go 1.26`, and without this the action is happy with
          # whatever 1.26.x the runner image already has. Most of the findings
          # this job reports are standard-library ones fixed in a patch release,
          # so a stale toolchain makes it fail on a vulnerability that a current
          # Go does not have -- as GO-2026-6089 and GO-2026-6090 did, both fixed
          # in 1.26.6 while the runner sat on 1.26.5.
          check-latest: true
          # This job builds both Go modules, so the cache key has to cover both
          # go.sums. Without this the action looks for a dependency file at the
          # repo root, finds none, and skips the restore -- the job still passes,
          # so the only symptom is it silently redownloading every dependency.
          cache-dependency-path: |
            services/api/go.sum
            services/fusion/go.sum

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (api)
        working-directory: services/api
        run: govulncheck ./...

      - name: govulncheck (fusion)
        working-directory: services/fusion
        run: govulncheck ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit (sensor-wifi)
        working-directory: services/sensor-wifi
        run: |
          # pip is upgraded first because pip-audit audits the environment it
          # runs in, pip included. A stale runner pip fails this job on
          # advisories about the packaging tool rather than anything ClassG ships.
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pip-audit
          # classg-sensor-wifi itself is not on PyPI, so it is skipped not failed.
          pip-audit --skip-editable

      - name: cargo audit (sensor-sdr)
        working-directory: services/sensor-sdr
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: npm audit (ui)
        working-directory: services/ui
        # High and above only: a moderate advisory in a dev-only transitive dep
        # should not block a sensor fix from merging at 2am.
        run: npm audit --audit-level=high

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [python, go, api, ui, rust, schemas, shell, security]
    if: always()
    steps:
      - name: Check results
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            echo "::error::one or more jobs failed"; exit 1
          fi
          echo "all suites passed"
